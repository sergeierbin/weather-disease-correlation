version: 2

sources:
  - name: raw
    schema: raw
    description: Raw data loaded by ingestion scripts — do not query directly in marts.
    loaded_at_field: loaded_at
    freshness:
      warn_after:  {count: 7,  period: day}
      error_after: {count: 30, period: day}
    tables:
      - name: patients
        description: Synthetic patients generated by Synthea (FHIR Patient resource).
      - name: encounters
        description: Healthcare visits from Synthea (FHIR Encounter resource).
      - name: conditions
        description: Diagnoses recorded during encounters (FHIR Condition resource).
      - name: organizations
        description: Healthcare organisations (hospitals, clinics) from Synthea (FHIR Organization resource).
      - name: weather
        description: Daily weather observations fetched via Meteostat at encounter organisation location.
      - name: icd10_codes
        description: WHO ICD-10 disease classification codes.
        freshness: null
