version: 2

models:
  - name: dim_patients
    columns:
      - name: patient_key
        data_tests:
          - unique
          - not_null

  - name: dim_diagnosis
    columns:
      - name: icd10_code
        data_tests:
          - not_null
      - name: condition_code_snomed
        data_tests:
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: dim_region
    columns:
      - name: region_key
        data_tests:
          - unique
          - not_null

  - name: dim_weather_type
    columns:
      - name: weather_type_key
        data_tests:
          - unique
          - not_null

  - name: fct_patient_day
    columns:
      - name: patient_day_key
        data_tests:
          - unique
          - not_null
      - name: patient_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_patients')
              field: patient_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: region_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_region')
              field: region_key

  - name: fct_patient_weather_region
    columns:
      - name: patient_weather_region_key
        data_tests:
          - unique
          - not_null
      - name: patient_key
        data_tests:
          - relationships:
              to: ref('dim_patients')
              field: patient_key
      - name: date_key
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: region_key
        data_tests:
          - relationships:
              to: ref('dim_region')
              field: region_key

  - name: fct_weather_region_day
    columns:
      - name: weather_region_day_key
        data_tests:
          - unique
          - not_null
