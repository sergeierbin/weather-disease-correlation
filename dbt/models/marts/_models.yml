version: 2

models:
  - name: dim_patients
    columns:
      - name: patient_id
        data_tests:
          - unique
          - not_null

  - name: dim_diagnosis
    columns:
      - name: icd10_code
        data_tests:
          - not_null
      - name: snomed_code
        data_tests:
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: dim_region
    columns:
      - name: region_key
        data_tests:
          - unique
          - not_null

  - name: dim_weather_type
    columns:
      - name: weather_type_key
        data_tests:
          - unique
          - not_null

  - name: fct_patient_day
    columns:
      - name: patient_day_key
        data_tests:
          - unique
          - not_null

  - name: fct_weather_region_day
    columns:
      - name: weather_region_day_key
        data_tests:
          - unique
          - not_null

  - name: fct_patient_weather_region
    columns:
      - name: patient_weather_key
        data_tests:
          - unique
          - not_null
